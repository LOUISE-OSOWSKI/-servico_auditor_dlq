spring:
  cloud:
    aws:
      credentials:
        access-key: YOUR_AWS_ACCESS_KEY_ID
        secret-key: YOUR_AWS_SECRET_ACCESS_KEY
      sqs:
        endpoint: https://sqs.us-east-1.amazonaws.com

# Para usar esta fila, copie este arquivo para application-secrets.yml e preencha as credenciais.
# application-secrets.yml está incluído no .gitignore para não ser versionado.
